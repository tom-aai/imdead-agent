[project]
name = "imdead-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "livekit-agents[assemblyai,google,images,lemonslice,silero,turn-detector]>=1.8.0",
    # The AssemblyAI TTS class (assemblyai.TTS) was added in the 1.8.9 plugin release;
    # 1.8.8 ships STT only. Pin the floor explicitly so the extra can't resolve below it.
    "livekit-plugins-assemblyai>=1.8.9",
    "python-dotenv>=1.1.1",
    "aiohttp>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
