[project]
name = "expertavatar-interview-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "livekit-agents[google,hedra,images,inworld,lemonslice,silero,turn-detector]>=1.5.1",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv>=1.1.1",
    "supabase>=2.23.2",
    "aiohttp>=3.10.0",
    "anthropic>=0.43.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
